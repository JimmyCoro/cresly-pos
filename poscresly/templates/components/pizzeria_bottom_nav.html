{% load static %}
<!-- Navbar inferior del módulo Pizzería (≤1023px). Único partial para
     toda la app — Inicio móvil (templates/movil/inicio.html) lo incluye
     igual que Mesas/Órdenes/Caja, ya no tiene su propia copia. Delivery
     se abre desde el menú lateral. Barra
     blanca de ancho completo, tabs con ícono+texto, FAB circular elevado
     y centrado para "Nueva orden". -->
<nav class="pzbn" id="pzBottomNav" aria-label="Navegación principal">
  <a href="{% url 'pizzeria_inicio' %}" class="pzbn-tab{% if request.path == '/pizzeria/' or request.path == '/pizzeria/movil/' %} pzbn-tab-active{% endif %}"{% if request.path == '/pizzeria/' or request.path == '/pizzeria/movil/' %} aria-current="page"{% endif %}>
    <i class="bi bi-house"></i>
    <span class="pzbn-tab-label">Inicio</span>
  </a>
  <a href="{% url 'pizzeria_mapa_mesas' %}" class="pzbn-tab{% if request.path == '/pizzeria/mesas/' %} pzbn-tab-active{% endif %}"{% if request.path == '/pizzeria/mesas/' %} aria-current="page"{% endif %}>
    <i class="bi bi-grid-3x3-gap"></i>
    <span class="pzbn-tab-label">Mesas</span>
  </a>
  <a href="{% url 'pizzeria_nueva_orden' %}" class="pzbn-fab" title="Nueva orden" aria-label="Nueva orden">
    <i class="bi bi-plus-lg"></i>
  </a>
  <a href="{% url 'pizzeria_ordenes' %}" class="pzbn-tab{% if '/pizzeria/ordenes/' in request.path %} pzbn-tab-active{% endif %}"{% if '/pizzeria/ordenes/' in request.path %} aria-current="page"{% endif %}>
    <i class="bi bi-list-ul"></i>
    <span class="pzbn-tab-label">Órdenes</span>
    <span class="pzbn-tab-badge" id="pzbnBadgeOrdenes"{% if not pz_ordenes_abiertas %} hidden{% endif %}>{{ pz_ordenes_abiertas|default:"" }}</span>
  </a>
  <a href="{% url 'pizzeria_caja' %}" class="pzbn-tab{% if '/pizzeria/caja/' in request.path %} pzbn-tab-active{% endif %}"{% if '/pizzeria/caja/' in request.path %} aria-current="page"{% endif %}>
    <i class="bi bi-cash-stack"></i>
    <span class="pzbn-tab-label">Caja</span>
  </a>
</nav>

<script>
  // El navbar vive dentro de .main-content (overflow:hidden). En varios
  // navegadores móviles, position:fixed dentro de un contenedor con
  // overflow queda recortado o se desplaza con el scroll en vez de
  // quedarse fijo — por eso se mueve al final de <body> en ese rango.
  (function () {
    var nav = document.getElementById('pzBottomNav');
    if (!nav) return;
    var originalParent = nav.parentNode;
    var originalNext = nav.nextSibling;
    var enBody = false;

    function actualizarPosicion() {
      var esAngosto = window.innerWidth <= 1023;
      if (esAngosto && !enBody) {
        document.body.appendChild(nav);
        enBody = true;
      } else if (!esAngosto && enBody) {
        originalParent.insertBefore(nav, originalNext);
        enBody = false;
      }
      if (esAngosto) {
        // Distancia real desde el borde inferior del viewport hasta la
        // parte de arriba del navbar, que es el espacio que el
        // carrito/contenido debe respetar (ver --pz-bottomnav-h).
        var rect = nav.getBoundingClientRect();
        var espacio = window.innerHeight - rect.top;
        document.documentElement.style.setProperty('--pz-bottomnav-h', espacio + 'px');
      }
    }

    actualizarPosicion();
    window.addEventListener('resize', actualizarPosicion);
  })();

  // Badge de Órdenes en vivo. El número viene del servidor al cargar, pero
  // pantallas como Nueva orden guardan sin recargar, y otros dispositivos
  // también crean pedidos. Se vuelve a pedir el conteo cuando:
  // - el servidor avisa por WebSocket que un pedido o mesa cambió,
  // - esta pestaña dispara 'pz:ordenes-cambiaron' tras guardar,
  // - la página vuelve desde el historial (atrás) o se vuelve visible.
  (function () {
    var badge = document.getElementById('pzbnBadgeOrdenes');
    if (!badge) return;
    var URL_CONTEO = "{% url 'pizzeria_contar_pedidos_abiertos' %}";
    var pendiente = null;

    function refrescar() {
      // Agrupa avisos seguidos (un cobro manda varios) en una sola consulta.
      clearTimeout(pendiente);
      pendiente = setTimeout(function () {
        fetch(URL_CONTEO, { credentials: 'same-origin', cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            if (!data) return;
            badge.textContent = data.abiertos || '';
            badge.hidden = !data.abiertos;
          })
          .catch(function () {});
      }, 250);
    }

    window.addEventListener('pz:ordenes-cambiaron', refrescar);
    window.addEventListener('pageshow', function (e) { if (e.persisted) refrescar(); });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') refrescar();
    });

    function conectar() {
      var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      var ws;
      try { ws = new WebSocket(proto + '//' + location.host + '/ws/pizzeria/mesas/'); } catch (e) { return; }
      ws.onmessage = function (e) {
        var msg;
        try { msg = JSON.parse(e.data); } catch (err) { return; }
        if (msg.type === 'pedido_pizzeria_actualizado' || msg.type === 'mesa_actualizada') refrescar();
      };
      // Al reconectar se refresca por si hubo cambios mientras estuvo caído.
      ws.onclose = function () { setTimeout(function () { conectar(); refrescar(); }, 3000); };
    }
    conectar();
  })();
</script>
